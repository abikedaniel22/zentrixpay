name: PR checks

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  node-ci:
    name: Typecheck, build, lint, and tests
    runs-on: ubuntu-latest
    # Scratch database for the server's *.pg.test.ts integration tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint "server/src/**/*.{ts,tsx}" "web/src/**/*.{ts,tsx}" "packages/**/*.{ts,tsx}" "mcp/src/**/*.{ts,tsx}"
      - run: pnpm exec prettier --check "server/**/*.{ts,tsx,js,json,md}" "web/**/*.{ts,tsx,js,json,md}" "packages/**/*.{ts,tsx,js,json,md}" "mcp/**/*.{ts,tsx,js,json,md}"
      - run: pnpm run build:registry-client
      - run: pnpm --filter @zentrixpay/server typecheck
      - run: pnpm --filter @zentrixpay/server build
      - run: pnpm --filter @zentrixpay/server test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: pnpm --filter @zentrixpay/web typecheck
      - run: pnpm --filter @zentrixpay/web build
      - run: pnpm --filter @zentrixpay/web test
      - run: pnpm --filter @zentrixpay/mcp typecheck
      - run: pnpm --filter @zentrixpay/mcp test
      - run: pnpm --filter @zentrixpay/registry-client typecheck
      - run: pnpm --filter @zentrixpay/registry-client test
      # Build the MCP server, then start it the way an agent client does
      # (node dist/index.js over stdio) and drive fixture-backed tool calls.
      # Catches an install that compiles and packs but cannot boot or serve —
      # the unit suites never start the process, so nothing else would.
      - run: pnpm --filter @zentrixpay/mcp build
      # The tool reference and summary are generated from mcp/src/tools.ts; a
      # tool change without a regenerate leaves docs that describe the wrong
      # surface. Fails when either committed file differs from what the
      # generator writes (after the same prettier pass the commit hook runs).
      - run: pnpm --filter @zentrixpay/mcp check-tool-docs
      - run: pnpm --filter @zentrixpay/mcp smoke:install
      - run: pnpm test

  contract-ci:
    name: Contract formatting, lint, and tests
    runs-on: ubuntu-latest
    needs: node-ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/Cargo.toml', 'contract/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cd contract && cargo fmt --all -- --check
      - run: cd contract && cargo clippy --all-targets --all-features -- -D warnings
      - run: cd contract && cargo build --all-targets --all-features
      - run: cd contract && cargo test
